[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gphotos"
version = "1.0.0"
description = "Organize a Google Takeout, and keep an existing photo archive's metadata in sync with it"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"          # tomllib
dependencies = []                    # base install is stdlib + exiftool, on purpose
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
upload = ["google-auth", "google-auth-oauthlib", "requests"]
phash = ["pillow", "imagehash", "numpy", "pillow-heif"]
all = ["gphotos[upload,phash]"]

[project.scripts]
gphotos = "gphotos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
